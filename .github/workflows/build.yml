name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          RAW_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAW_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Buang spasi / karakter tak terlihat yang sering ikut saat copy-paste.
          clean() { v=$(printf '%s' "$1" | LC_ALL=C tr -cd '\041-\176'); printf '%s' "${v##*=}"; }
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"
            STORE_PW=$(clean "$RAW_STORE_PW"); ALIAS=$(clean "$RAW_ALIAS"); KEY_PW=$(clean "$RAW_KEY_PW")
            echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
            # Alias dibaca langsung dari file kunci (secret KEY_ALIAS hanya cadangan).
            FOUND=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" 2>/dev/null | grep -i 'PrivateKeyEntry' | head -1 | cut -d, -f1)
            if [ -n "$FOUND" ]; then ALIAS="$FOUND"; fi
            [ -n "$KEY_PW" ] || KEY_PW="$STORE_PW"
            echo "Alias kunci: $ALIAS"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$STORE_PW"
              echo "KEY_ALIAS=$ALIAS"
              echo "KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
            echo "Pakai kunci rilis."
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi, APK ditandatangani kunci debug."
          fi

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Siapkan file rilis
        run: cp app/build/outputs/apk/release/app-release.apk RemotCanggih.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RemotCanggih-${{ github.run_number }}
          path: RemotCanggih.apk

      - name: Terbitkan rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Remot Canggih v1.0.${{ github.run_number }}
          body: |
            Download: https://baramarket.my.id/remot/download
            Commit: ${{ github.sha }}
          files: RemotCanggih.apk
          make_latest: true
